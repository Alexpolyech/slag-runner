<script>/* Stand-in for Claude's live-room API, backed by this site's WebSocket server.
   The game asks for window.claude.use('room') and gets join / on / emit / presence / peers / leave. */
(function () {
  if (window.claude && typeof window.claude.use === 'function') return;
  function join(name) {
    return new Promise(function (resolve, reject) {
      var ws;
      try { ws = new WebSocket((location.protocol === 'https:' ? 'wss://' : 'ws://') + location.host + '/ws?room=' + encodeURIComponent(name)); }
      catch (e) { return reject({ code: 'unavailable' }); }
      var me = null, myP = {}, peers = new Map(), subs = [], opened = false, left = false;
      var timer = setTimeout(function () { try { ws.close(); } catch (_) {} reject({ code: 'timeout' }); }, 8000);
      function tx(o) { if (ws.readyState === 1) ws.send(JSON.stringify(o)); }
      var rm = {
        peers: function () {
          var out = [{ peer: me, presence: myP, isMe: true, kind: 'viewer', sameTab: true }];
          peers.forEach(function (p, id) { out.push({ peer: id, presence: p || {}, isMe: false, kind: 'viewer', sameTab: false }); });
          return out;
        },
        on: function (topic, fn, onErr) {
          var s = { topic: topic, fn: fn, onErr: onErr }; subs.push(s);
          return function () { subs = subs.filter(function (x) { return x !== s; }); };
        },
        emit: function (topic, data) {
          if (ws.readyState !== 1) return Promise.reject({ code: 'disconnected' });
          tx({ t: 'e', k: topic, d: data }); return Promise.resolve();
        },
        presence: function (o) {
          myP = o || {};
          if (ws.readyState !== 1) return Promise.reject({ code: 'disconnected' });
          tx({ t: 'p', d: myP }); return Promise.resolve();
        },
        leave: function () { left = true; subs = []; try { ws.close(); } catch (_) {} return Promise.resolve(); },
      };
      ws.onmessage = function (ev) {
        var m; try { m = JSON.parse(ev.data); } catch (_) { return; }
        if (m.t === 'hi') {
          me = m.id; (m.peers || []).forEach(function (p) { peers.set(p.id, p.p || {}); });
          opened = true; clearTimeout(timer); resolve(rm);
        } else if (m.t === 'err') { clearTimeout(timer); reject({ code: m.code }); }
        else if (m.t === 'j') peers.set(m.id, {});
        else if (m.t === 'l') peers.delete(m.id);
        else if (m.t === 'p') peers.set(m.id, m.d || {});
        else if (m.t === 'e') {
          subs.slice().forEach(function (s) { if (s.topic === m.k) { try { s.fn({ peer: m.id, isMe: false, data: m.d, topic: m.k }); } catch (e) { console.error(e); } } });
        }
      };
      ws.onclose = function () {
        clearTimeout(timer);
        if (!opened) return reject({ code: 'unavailable' });
        if (!left) subs.slice().forEach(function (s) { if (s.onErr) { try { s.onErr({ code: 'disconnected' }); } catch (_) {} } });
      };
      ws.onerror = function () {};
    });
  }
  window.claude = { use: function (n) { return Promise.resolve(n === 'room' ? { join: join } : null); } };
})();
</script>
<meta name="claude:viewport-fit-sides" content="cover">
<title>Slag Runner</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: one centered stage (960x544 canvas scaled to width) under a slim title bar; touch pad appears under the stage on coarse pointers; key legend last. Single dark look by choice: a dead foundry lit by ember orange and arc cyan. */
:root{
  --bg:#0c0e11; --panel:#14171c; --edge:#262b33; --fg:#e9e5da; --dim:#8a909b;
  --ember:#ff7a2f; --arc:#43d9e8;
  --display:'Chakra Petch',system-ui,-apple-system,'Segoe UI',sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg)}
body{
  color:var(--fg);font-family:var(--display);
  padding-block:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
}
.wrap{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
h1{margin:0;font-size:20px;line-height:1;letter-spacing:.16em;text-transform:uppercase;font-weight:700}
h1 span{color:var(--ember)}
.tools{display:flex;gap:8px}
button{
  font:600 12px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;
  color:var(--fg);background:var(--panel);border:1px solid var(--edge);
  padding:10px 12px;border-radius:4px;cursor:pointer;
}
button:hover{border-color:var(--ember)}
button:focus-visible,canvas:focus-visible{outline:2px solid var(--arc);outline-offset:2px}
.stage{position:relative;background:#000;border:1px solid var(--edge);border-radius:4px;overflow:hidden}
canvas{display:block;width:100%;height:auto;aspect-ratio:960/544;touch-action:none;cursor:crosshair;background:#000}
.stage:fullscreen{display:flex;align-items:center;justify-content:center;border:0;border-radius:0}
.stage:fullscreen canvas{width:min(100vw,calc(100vh*960/544))}
.touch{display:none;justify-content:space-between;align-items:flex-end;gap:12px;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none;touch-action:none}
.pad{display:flex;gap:10px}
.padr{display:flex;flex-direction:column;align-items:flex-end;gap:8px}
.tb{min-width:68px;height:64px;font-size:18px;padding:0 14px;touch-action:none;-webkit-tap-highlight-color:transparent}
.tb.wide{min-width:96px}
.tb.sm{min-width:56px;height:46px;font-size:13px;padding:0 10px}
.tb.on{background:var(--ember);border-color:var(--ember);color:#150a04}
.rot{display:none;margin:0;font:500 12px/1.3 var(--mono);color:var(--dim);text-align:center}
@media (pointer:coarse){
  .touch{display:flex;background:var(--bg);padding:10px 12px;flex-wrap:wrap}
  .keys{display:none!important}
  .rot{display:block}
}
/* phone held sideways: the controls float over the game so it can use the whole screen */
@media (pointer:coarse) and (orientation:landscape) and (max-height:620px){
  body{padding-block:4px}
  .bar{gap:6px}
  h1{font-size:14px}
  .tools button{padding:7px 9px;font-size:11px}
  .rot{display:none}
  canvas{width:min(100%,calc((100vh - 52px)*960/544));margin:0 auto}
  .stage{display:flex;justify-content:center}
  .touch{position:absolute;left:0;right:0;bottom:9%;padding:0 10px;background:transparent;pointer-events:none;flex-wrap:nowrap}
  .touch .tb{pointer-events:auto;background:rgba(20,23,28,.55);border-color:rgba(255,255,255,.25);height:54px;min-width:60px}
  .touch .tb.sm{height:40px;min-width:48px}
  .touch .tb.on{background:var(--ember);border-color:var(--ember)}
  .touch.off{visibility:hidden}
  .stage:fullscreen canvas{width:min(100vw,calc(100vh*960/544))}
}
.keys{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 18px;color:var(--dim);font-size:13px}
.keys li{display:flex;align-items:center;gap:5px;min-width:0}
[hidden]{display:none!important}
.lobby{background:var(--panel);border:1px solid var(--edge);border-radius:4px;padding:12px;display:flex;flex-direction:column;gap:10px}
.lobby[hidden]{display:none}
.lrow{display:flex;flex-wrap:wrap;gap:8px 12px;align-items:flex-end}
.lobby label{display:flex;flex-direction:column;gap:5px;font:600 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);min-width:0}
.lobby input{font:600 14px/1 var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--edge);border-radius:4px;padding:10px;width:150px;max-width:100%}
.lobby input:focus-visible{outline:2px solid var(--arc);outline-offset:1px}
#code{text-transform:uppercase;letter-spacing:.2em}
.rt{font:700 13px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--arc);align-self:center}
.roster{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:6px 16px;font:600 13px/1 var(--mono);align-self:center;flex:1 1 220px;min-width:0}
.roster li{display:flex;align-items:center;gap:7px;min-width:0}
.sw{width:11px;height:11px;border-radius:2px;flex:none}
.lmsg{margin:0;font:500 12px/1.4 var(--mono);color:var(--dim)}
.lmsg:empty{display:none}
kbd{font:600 11px/1 var(--mono);color:var(--fg);background:var(--panel);border:1px solid var(--edge);border-bottom-width:2px;border-radius:3px;padding:4px 6px}
</style>

<main class="wrap">
  <header class="bar">
    <h1>Slag <span>Runner</span></h1>
    <div class="tools">
      <button id="btnMenu" type="button">Menu</button>
      <button id="btnMute" type="button" aria-pressed="false">Sound on</button>
      <button id="btnFs" type="button">Fullscreen</button>
    </div>
  </header>

  <div class="stage" id="stage">
    <canvas id="c" width="960" height="544" tabindex="0" aria-label="Slag Runner game screen"></canvas>
    <div class="touch" id="touch">
      <div class="pad">
        <button class="tb" type="button" data-act="left" aria-label="Move left">&#9664;</button>
        <button class="tb" type="button" data-act="right" aria-label="Move right">&#9654;</button>
      </div>
      <div class="padr">
        <div class="pad">
          <button class="tb sm" type="button" data-act="upg" aria-label="Upgrade weapon">UP</button>
          <button class="tb sm" type="button" data-act="tt" aria-label="Next turret type">T</button>
          <button class="tb sm" type="button" data-act="build" aria-label="Build turret">B</button>
          <button class="tb sm" type="button" data-act="grab" aria-label="Grab or place turret">E</button>
        </div>
        <div class="pad">
          <button class="tb sm" type="button" data-cyc="-1" aria-label="Previous weapon">&#9664; GUN</button>
          <button class="tb sm" type="button" data-cyc="1" aria-label="Next weapon">GUN &#9654;</button>
          <button class="tb wide" type="button" data-act="jump">JUMP</button>
        </div>
      </div>
      <p class="rot">Touch the screen to aim and shoot. Turn your phone sideways for a bigger view.</p>
    </div>
  </div>

  <section class="lobby" id="lobby" hidden aria-label="Online co-op">
    <div id="lobbySetup">
      <div class="lrow">
        <label for="nick">Your name<input id="nick" maxlength="12" autocomplete="off" spellcheck="false"></label>
        <label for="code">Room code<input id="code" maxlength="8" autocomplete="off" spellcheck="false" placeholder="ABCD"></label>
        <button id="btnHost" type="button">Host a room</button>
        <button id="btnJoin" type="button">Join</button>
        <button id="btnLobbyClose" type="button">Close</button>
      </div>
    </div>
    <div id="lobbyRoom" hidden>
      <div class="lrow">
        <strong id="roomTitle" class="rt"></strong>
        <ul class="roster" id="roster"></ul>
        <button id="btnCopy" type="button">Copy code</button>
        <button id="btnLeave" type="button">Leave</button>
      </div>
      <div class="lrow" id="hostRow" hidden style="margin-top:10px">
        <button id="btnStartCamp" type="button">Start campaign</button>
        <button id="btnStartEnd" type="button">Start endless</button>
        <button id="btnStartTD" type="button">Start tower defence</button>
      </div>
    </div>
    <p class="lmsg" id="lobbyMsg" role="status"></p>
  </section>

  <ul class="keys" aria-label="Controls">
    <li><kbd>A</kbd><kbd>D</kbd> Move</li>
    <li><kbd>W</kbd> Jump, hold for height</li>
    <li>Click: aim and shoot</li>
    <li><kbd>1</kbd>-<kbd>8</kbd> or wheel: Switch weapon</li>
    <li><kbd>U</kbd> Upgrade weapon <kbd>T</kbd> Turret type <kbd>B</kbd> Build <kbd>E</kbd> Grab or place</li>
    <li>Land on enemies to stomp them</li>
  </ul>
</main>

<script>
(() => {
'use strict';

/* ================= constants ================= */
const TS = 32, VW = 960, VH = 544, DT = 1 / 60;
const GRAV = 1900, JUMP = 700, RUN = 250, MAXFALL = 900;
const $ = id => document.getElementById(id);
const cv = $('c'), ctx = cv.getContext('2d');
const stage = $('stage');

const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const rand = (a, b) => a + Math.random() * (b - a);
const hash = (x, y) => {
  let h = Math.imul(x | 0, 374761393) ^ Math.imul(y | 0, 668265263);
  h = Math.imul(h ^ (h >>> 13), 1274126177);
  return ((h ^ (h >>> 16)) >>> 0) / 4294967296;
};
const overlap = (a, b) => a.x < b.x + b.w && a.x + a.w > b.x && a.y < b.y + b.h && a.y + a.h > b.y;

/* ================= audio ================= */
let actx = null, master = null, muted = false;
function initAudio() {
  if (actx) { if (actx.state === 'suspended') actx.resume(); return; }
  try {
    const AC = window.AudioContext || window.webkitAudioContext;
    if (!AC) return;
    actx = new AC();
    master = actx.createGain();
    master.gain.value = 0.35;
    master.connect(actx.destination);
  } catch (e) { actx = null; }
}
function tone(freq, dur, type, vol, slide, delay) {
  if (!actx || muted) return;
  try {
    const t = actx.currentTime + (delay || 0);
    const o = actx.createOscillator(), g = actx.createGain();
    o.type = type || 'square';
    o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t);
    g.gain.exponentialRampToValueAtTime(0.001, t + dur);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t + dur + 0.03);
  } catch (e) {}
}
function noise(dur, vol, lp) {
  if (!actx || muted) return;
  try {
    const n = Math.floor(actx.sampleRate * dur);
    const buf = actx.createBuffer(1, n, actx.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < n; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / n);
    const s = actx.createBufferSource(); s.buffer = buf;
    const f = actx.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
    const g = actx.createGain(); g.gain.value = vol;
    s.connect(f); f.connect(g); g.connect(master); s.start();
  } catch (e) {}
}
const sfx = {
  shoot: () => tone(820, 0.07, 'square', 0.06, -500),
  eshoot: () => tone(300, 0.12, 'sawtooth', 0.05, -120),
  jump: () => tone(300, 0.13, 'square', 0.06, 300),
  land: () => tone(120, 0.06, 'triangle', 0.09, -40),
  hurt: () => { tone(200, 0.25, 'sawtooth', 0.13, -140); noise(0.15, 0.15, 1200); },
  hit: () => tone(240, 0.05, 'square', 0.06, -60),
  boom: () => noise(0.4, 0.3, 900),
  pick: () => { tone(700, 0.07, 'triangle', 0.14); tone(1050, 0.1, 'triangle', 0.14, 0, 0.07); },
  power: () => [500, 700, 900, 1200].forEach((f, i) => tone(f, 0.1, 'square', 0.08, 0, i * 0.07)),
  check: () => { tone(520, 0.1, 'triangle', 0.14); tone(780, 0.16, 'triangle', 0.14, 0, 0.1); },
  stomp: () => tone(160, 0.1, 'square', 0.1, -80),
  warn: () => { tone(180, 0.3, 'sawtooth', 0.1); tone(180, 0.3, 'sawtooth', 0.1, 0, 0.4); },
  clear: () => [523, 659, 784, 1046].forEach((f, i) => tone(f, 0.16, 'square', 0.09, 0, i * 0.12)),
};

/* ================= input ================= */
const aim = { mode: 'key', x: VW / 2, y: VH / 2, down: false };
const down = new Set(), just = {}, touchHeld = {};
const ACT = {
  left: ['KeyA'], right: ['KeyD'], jump: ['KeyW'],
  w1: ['Digit1'], w2: ['Digit2'], w3: ['Digit3'], w4: ['Digit4'], w5: ['Digit5'], w6: ['Digit6'], w7: ['Digit7'], w8: ['Digit8'],
  build: ['KeyB'], grab: ['KeyE'], tt: ['KeyT'], upg: ['KeyU'],
  pause: ['Escape'],
};
const CODE2ACT = {};
for (const a in ACT) for (const c of ACT[a]) CODE2ACT[c] = a;
const held = a => !!touchHeld[a] || ACT[a].some(c => down.has(c));
const clearJust = () => { for (const k in just) just[k] = false; };

window.addEventListener('keydown', e => {
  const a = CODE2ACT[e.code];
  if (!a) return;
  if (e.target && e.target.tagName === 'INPUT') return;
  if (!e.repeat) just[a] = true;
  down.add(e.code);
  initAudio();
});
window.addEventListener('keyup', e => { down.delete(e.code); });
window.addEventListener('blur', () => {
  down.clear();
  for (const k in touchHeld) touchHeld[k] = false;
  if (state === 'play' && !net.on) state = 'paused';
});
document.addEventListener('visibilitychange', () => { if (document.hidden && state === 'play' && !net.on) state = 'paused'; });

function pointerPos(e) {
  const r = cv.getBoundingClientRect();
  return { x: (e.clientX - r.left) * VW / r.width, y: (e.clientY - r.top) * VH / r.height };
}
cv.addEventListener('pointerdown', e => {
  initAudio();
  const p = pointerPos(e);
  aim.x = p.x; aim.y = p.y; aim.mode = 'mouse'; aim.down = state === 'play';
  try { cv.setPointerCapture(e.pointerId); } catch (_) {}
  try { cv.focus({ preventScroll: true }); } catch (_) {}
  if (state === 'play') { const h = hudHit(p); if (h) { aim.down = false; h(); e.preventDefault(); return; } }
  if (state === 'title') {
    if (!net.on) for (const b of TITLE_BTNS) {
      if (p.x >= b.x && p.x <= b.x + b.w && p.y >= b.y && p.y <= b.y + b.h) {
        if (b.start === 'online') openLobby(); else startGame(b.start);
        break;
      }
    }
  } else if (state !== 'play') just.start = true;
  e.preventDefault();
});
cv.addEventListener('pointermove', e => {
  const p = pointerPos(e);
  aim.x = p.x; aim.y = p.y;
  if (e.pointerType === 'mouse') aim.mode = 'mouse';
});
const pointerEnd = e => { aim.down = false; if (e.pointerType && e.pointerType !== 'mouse') aim.mode = 'key'; };
cv.addEventListener('pointerup', pointerEnd);
cv.addEventListener('pointercancel', pointerEnd);
cv.addEventListener('contextmenu', e => e.preventDefault());
cv.addEventListener('wheel', e => { if (state === 'play') { cycleWeapon(e.deltaY > 0 ? 1 : -1); e.preventDefault(); } }, { passive: false });

document.querySelectorAll('[data-act]').forEach(b => {
  const a = b.dataset.act;
  const on = e => {
    e.preventDefault();
    touchHeld[a] = true; just[a] = true; aim.mode = 'key';
    b.classList.add('on'); initAudio();
    try { b.setPointerCapture(e.pointerId); } catch (_) {}
  };
  const off = () => { touchHeld[a] = false; b.classList.remove('on'); };
  b.addEventListener('pointerdown', on);
  b.addEventListener('pointerup', off);
  b.addEventListener('pointercancel', off);
  b.addEventListener('lostpointercapture', off);
});

document.querySelectorAll('[data-cyc]').forEach(b => {
  b.addEventListener('pointerdown', e => {
    e.preventDefault(); initAudio();
    if (state === 'play') cycleWeapon(+b.dataset.cyc);
    b.classList.add('on');
  });
  const off = () => b.classList.remove('on');
  b.addEventListener('pointerup', off); b.addEventListener('pointercancel', off); b.addEventListener('pointerleave', off);
});
/* the floating controls only show while a run is on (they would cover the title buttons) */
{
  const tEl = $('touch'); let lastOff = null;
  if (typeof setInterval === 'function') setInterval(() => { const o = state !== 'play'; if (o !== lastOff) { lastOff = o; tEl.classList.toggle('off', o); } }, 150);
}

function setMuted(m) {
  muted = m;
  $('btnMute').textContent = muted ? 'Sound off' : 'Sound on';
  $('btnMute').setAttribute('aria-pressed', String(muted));
}
$('btnMute').addEventListener('click', e => { setMuted(!muted); e.currentTarget.blur(); });
$('btnMenu').addEventListener('click', e => {
  e.currentTarget.blur();
  aim.down = false;
  if (net.on) { netLeave(); return; }
  if (state !== 'title') { state = 'title'; loadLevel(0); banner = null; }
});
if (!document.fullscreenEnabled) $('btnFs').hidden = true;
$('btnFs').addEventListener('click', e => {
  e.currentTarget.blur();
  try {
    if (document.fullscreenElement) document.exitFullscreen();
    else if (stage.requestFullscreen) { const r = stage.requestFullscreen(); if (r && r.catch) r.catch(() => {}); }
  } catch (_) {}
});

/* ================= levels ================= */
const THEMES = [
  { sky: ['#0f1a23', '#1a2b36'], far: '#15252f', mid: '#1c313e', glow: '#43d9e8', tile: '#2a3a45', tile2: '#243540', seam: '#1a2730', top: '#4fd0dc', topShade: '#2c8792', liquid: '#1d7a90', liquid2: '#7cecf5', spike: '#c8d0d8', name: 'coolant', place: 'Coolant Works' },
  { sky: ['#1e0f0c', '#38170f'], far: '#2b1510', mid: '#3c1f15', glow: '#ff9a3d', tile: '#4a3126', tile2: '#412a21', seam: '#2e1c15', top: '#ff8a3d', topShade: '#a84d18', liquid: '#d63e12', liquid2: '#ffb14a', spike: '#d4cdc6', name: 'slag', place: 'Smelter Row' },

/* Endless is ONE level with no sectors. The world is cut into 48-tile chunks that are generated
   from the room seed as the players get near and thrown away when they are far. Every chunk starts
   and ends with flat ground, and the pits, platforms and rises inside obey the jump limits
   (max 4-tile pits, rises of 3 or less). Chunk i always looks the same for the same seed, so

let RNG = Math.random;

const chunkOf = x => Math.floor(x / (CW * TS));

function makeEndless(seed) {

  if (!isAuth()) return;
  let tm = maxDist;
  if (net.on) for (const r of net.remotes.values()) if (r.tx !== undefined) tm = Math.max(tm, Math.floor(Math.abs(r.x - L.startX) / TS));

}

function tileAt(tx, ty) {
  if (L.endless) {
    if (ty < 0 || ty >= L.h) return 0;
    const ci = Math.floor(tx / CW), c = L.chunks.get(ci);
    return c ? c.g[ty * CW + (tx - ci * CW)] : 1;
  }
  if (tx < 0 || tx >= L.w) return 1;
  if (ty < 0 || ty >= L.h) return 0;
  return L.g[ty * L.w + tx];
}
const solidAt = (tx, ty) => tileAt(tx, ty) === 1;

function moveX(e, dx) {
  e.x += dx;
  const t0 = Math.floor(e.y / TS), t1 = Math.floor((e.y + e.h - 0.01) / TS);
  if (dx > 0) {
    const tx = Math.floor((e.x + e.w - 0.01) / TS);
    for (let ty = t0; ty <= t1; ty++) if (solidAt(tx, ty)) { e.x = tx * TS - e.w; e.hitX = true; e.vx = 0; return; }
  } else if (dx < 0) {
    const tx = Math.floor(e.x / TS);
    for (let ty = t0; ty <= t1; ty++) if (solidAt(tx, ty)) { e.x = (tx + 1) * TS; e.hitX = true; e.vx = 0; return; }
  }
}
function moveY(e, dy) {
  e.y += dy;
  const t0 = Math.floor(e.x / TS), t1 = Math.floor((e.x + e.w - 0.01) / TS);
  if (dy > 0) {
    const ty = Math.floor((e.y + e.h - 0.01) / TS);
    for (let tx = t0; tx <= t1; tx++) if (solidAt(tx, ty)) { e.y = ty * TS - e.h; e.vy = 0; e.onGround = true; return; }
  } else if (dy < 0) {
    const ty = Math.floor(e.y / TS);
    for (let tx = t0; tx <= t1; tx++) if (solidAt(tx, ty)) { e.y = (ty + 1) * TS; e.vy = 0; return; }
  }
}

function buildBG() {
  const far = [], mid = [];
  let x = 0, i = 0;
  const span = L.endless ? 9000 : L.w * TS;
  const farW = span * 0.25 + VW + 200;
  while (x < farW) {
    const w = (40 + hash(i, 1) * 90) | 0, h = (90 + hash(i, 2) * 170) | 0;
    far.push({ x, w, h }); x += w + ((hash(i, 3) * 30) | 0); i++;
  }
  x = 0; i = 0;
  const midW = span * 0.5 + VW + 300;
  while (x < midW) {
    if (hash(i, 5) < 0.45) {
      const w = (26 + hash(i, 6) * 16) | 0, h = (170 + hash(i, 7) * 170) | 0;
      mid.push({ k: 0, x, w, h, i }); x += w + ((60 + hash(i, 8) * 80) | 0);
    } else {
      const w = (90 + hash(i, 9) * 70) | 0, h = (70 + hash(i, 10) * 60) | 0;
      mid.push({ k: 1, x, w, h, i }); x += w + ((30 + hash(i, 11) * 60) | 0);
    }
    i++;
  }
  L.bgFar = far; L.bgMid = mid; L.bgFarP = farW; L.bgMidP = midW;
  const g = ctx.createLinearGradient(0, 0, 0, VH);
  g.addColorStop(0, L.theme.sky[0]); g.addColorStop(1, L.theme.sky[1]);
  L.skyGrad = g;
}

function makeEnemy(d, id) {
  const T = ENEMY[d.type];
  const e = {
    id, type: d.type, w: T.w, h: T.h, hp: T.hp, vx: 0, vy: 0, x: d.tx * TS + (TS - T.w) / 2, y: 0,
    dir: Math.random() < 0.5 ? -1 : 1, t: Math.random() * 6, flash: 0, cool: rand(0.6, 1.6),
    dead: false, ceil: !!d.ceil, onGround: false, hitX: false, ang: Math.PI / 2,
  };
  const dd = Math.min(d.dd !== undefined ? d.dd : (L.diff || 0), 24);
  e.spd = 1 + dd * 0.025;
  e.cdm = Math.max(0.55, 1 - dd * 0.025);
  e.hp += Math.floor(dd / 6); e.mhp = e.hp;
  if (d.type === 'charger') { e.ang = 0; e.mode = 0; }
  if (d.type === 'sniper') e.dir = -1;
  if (T.fly) { e.x = d.tx * TS; e.y = d.ty * TS; }
  else if (d.ceil) e.y = d.ty * TS;
  else e.y = d.ty * TS - T.h;
  return e;
}

function shoot(ang) {

    p.cool = 0.55; p.recoil = 0.14;

    shake = Math.max(shake, 4);
    tone(1300, 0.2, 'sawtooth', 0.07, -1000);
  } else if (w === 3) {
    bullet(mx, my, ang + (Math.random() - 0.5) * 0.16, { sp: 360 + Math.random() * 80, life: 0.36 + 0.04 * u, kind: 3, r: 5, dmg: 0.6 * dm, pierce: 99 });
    p.cool = 0.06; p.recoil = 0.04;

    p.cool = 0.7; p.recoil = 0.14;

/* ---- arc lightning (player weapon and arc turret): a bolt that jumps between enemies ---- */
let arcs = [];
function arcStrike(x, y, ang, range, dmg, chain) {
  const dx = Math.cos(ang), dy = Math.sin(ang);
  let len = range;
  for (let d = 12; d <= range; d += 8) { if (solidAt(Math.floor((x + dx * d) / TS), Math.floor((y + dy * d) / TS))) { len = d; break; } }
  let first = null, bt = 1e9;
  for (const e of enemies) {
    if (e.dead) continue;
    const cx = e.x + e.w / 2, cy = e.y + e.h / 2, t = (cx - x) * dx + (cy - y) * dy;
    if (t < 0 || t > len + 12) continue;
    if (Math.abs((cx - x) * dy - (cy - y) * dx) < 26 + e.h / 4 && t < bt) { bt = t; first = e; }
  }
  let bossHit = false;
  if (boss && !boss.hidden && boss.state === 'fight') {
    const bx = boss.x + boss.w / 2, by = boss.y + boss.h / 2, t = (bx - x) * dx + (by - y) * dy;
    if (t > 0 && t < len + 60 && t < bt && Math.abs((bx - x) * dy - (by - y) * dx) < 70) bossHit = true;
  }
  const pts = [[x, y]];
  if (bossHit) {
    pts.push([boss.x + boss.w / 2, boss.y + boss.h / 2]);
    hitBoss({ x: boss.x + boss.w / 2, y: boss.y + boss.h / 2 }, dmg);
  } else if (first) {
    const hit = new Set([first]);
    let cur = first;
    pts.push([cur.x + cur.w / 2, cur.y + cur.h / 2]);
    damageEnemy(cur, dmg);
    for (let c = 0; c < chain; c++) {
      let nx = null, nd = 140 * 140;
      for (const e of enemies) {
        if (e.dead || hit.has(e)) continue;
        const d = (e.x + e.w / 2 - (cur.x + cur.w / 2)) ** 2 + (e.y + e.h / 2 - (cur.y + cur.h / 2)) ** 2;
        if (d < nd) { nd = d; nx = e; }
      }
      if (!nx) break;
      hit.add(nx); cur = nx;
      pts.push([cur.x + cur.w / 2, cur.y + cur.h / 2]);
      damageEnemy(cur, dmg);
    }
  } else pts.push([x + dx * len, y + dy * len]);
  arcs.push({ pts, t: 0.16 });
  if (arcs.length > 40) arcs.splice(0, arcs.length - 40);
}
/* what teammates see: a bolt along the ray (their own game decides what it hit) */
function arcFx(x, y, ang, range) {
  let len = range;
  for (let d = 12; d <= range; d += 8) { if (solidAt(Math.floor((x + Math.cos(ang) * d) / TS), Math.floor((y + Math.sin(ang) * d) / TS))) { len = d; break; } }
  arcs.push({ pts: [[x, y], [x + Math.cos(ang) * len, y + Math.sin(ang) * len]], t: 0.16 });
  if (arcs.length > 40) arcs.splice(0, arcs.length - 40);
  tone(900, 0.1, 'sawtooth', 0.03, -500);
}
function drawArcs() {
  for (const a of arcs) {
    const al = clamp(a.t / 0.16, 0, 1);
    for (let i = 0; i + 1 < a.pts.length; i++) {
      const [x0, y0] = a.pts[i], [x1, y1] = a.pts[i + 1];
      const n = Math.max(3, Math.ceil(Math.hypot(x1 - x0, y1 - y0) / 18)), nx = -(y1 - y0), ny = x1 - x0, nl = Math.hypot(nx, ny) || 1;
      ctx.beginPath(); ctx.moveTo(x0, y0);
      for (let k = 1; k < n; k++) {
        const f = k / n, j = (Math.random() - 0.5) * 16;
        ctx.lineTo(x0 + (x1 - x0) * f + nx / nl * j, y0 + (y1 - y0) * f + ny / nl * j);

    p.deadT += dt;
    if (p.deadT > 1.5) {
      if (lives <= 0) { if (!net.on) { state = 'over'; clearT = 0; aim.down = false; saveBest(); } } else respawn();
    }
    return;
  }
  if (p.inv > 0) p.inv -= dt;
  if (p.knock > 0) p.knock -= dt;
  if (p.landT > 0) p.landT -= dt;
  if (p.recoil > 0) p.recoil -= dt;
  p.cool -= dt;

  const dir = p.knock > 0 ? 0 : (held('right') ? 1 : 0) - (held('left') ? 1 : 0);
  if (p.knock <= 0) {
    const target = dir * RUN;
    const acc = dir ? (p.onGround ? 2800 : 1800) : (p.onGround ? 3200 : 500);
    const d = target - p.vx;
    p.vx += Math.sign(d) * Math.min(Math.abs(d), acc * dt);
  }

  if (just.jump) p.jumpBuf = 0.12; else p.jumpBuf -= dt;
  p.coyote = p.onGround ? 0.1 : p.coyote - dt;
  if (p.jumpBuf > 0 && p.coyote > 0) {
    p.vy = -JUMP; p.jumpBuf = 0; p.coyote = 0; p.jumping = true;
    sfx.jump(); puff(p.x + p.w / 2, p.y + p.h, 4);
  }
  if (p.vy < 0 && p.jumping && !held('jump') && p.vy < -JUMP * 0.42) p.vy = -JUMP * 0.42;

  p.vy = Math.min(MAXFALL, p.vy + GRAV * (p.vy > 0 ? 1.2 : 1) * dt);
  const wasGround = p.onGround;
  p.hitX = false;
  moveX(p, p.vx * dt);
  p.onGround = false;
  moveY(p, p.vy * dt);
  if (p.onGround) {
    p.jumping = false;
    if (!wasGround) { puff(p.x + p.w / 2, p.y + p.h, 5); p.landT = 0.1; sfx.land(); }
    if (dir) p.anim += Math.abs(p.vx) * dt * 0.05; else p.anim = 0;
  }

  // aim & fire
  const cx = p.x + p.w / 2, cy = p.y + 16;
  let ang;
  if (aim.mode === 'mouse') {
    ang = Math.atan2(aim.y - cy, aim.x + cam.x - cx);
    p.face = Math.cos(ang) >= 0 ? 1 : -1;
  } else {
    if (dir) p.face = dir;
    ang = p.face > 0 ? 0 : Math.PI;
  }
  p.ang = ang;
  for (let k = 0; k < NW; k++) if (just['w' + (k + 1)]) selectWeapon(k);
  if (just.tt) cycleTurret();
  if (just.upg) doUpgrade();
  if (just.build) doBuild();
  if (just.grab) doGrab();
  if (aim.down && p.cool <= 0) shoot(ang);

  // hazards
  const x0 = Math.floor(p.x / TS), x1 = Math.floor((p.x + p.w - 1) / TS);
  const y0 = Math.floor(p.y / TS), y1 = Math.floor((p.y + p.h - 1) / TS);
  for (let ty = y0; ty <= y1; ty++) for (let tx = x0; tx <= x1; tx++) {
    if (tileAt(tx, ty) === 2 && p.y + p.h > ty * TS + 14) hurtPlayer(1, p.x + p.w / 2, true);
  }
  if (p.y > L.h * TS + 30) {
    burst(p.x + p.w / 2, L.h * TS - 4, 18, L.theme.liquid2, 260, 0.8, 4);
    killPlayer();
  }

  // checkpoints
  for (let ci = 0; ci < L.checks.length; ci++) {
    const c = L.checks[ci];
    if (!c.on && overlap(p, c)) {
      c.on = true;
      if (L.endless) L.chkDone.add(c.cid);
      else if (net.on && !net.isHost) netEmit('chk', { i: ci });
      L.respawn = { x: c.rx, y: c.ry };
      p.hp = Math.min(p.maxhp, p.hp + 1);
      showBanner('CHECKPOINT', '', 1.6); sfx.check();
      burst(c.x + 16, c.y + 8, 14, '#ffd27a', 200, 0.6, 3, 0);
    }
  }

  // boss arena trigger
  if (isAuth() && L.arena && !L.sealed && !L.cleared && p.x > (L.arena.x + 3) * TS) sealArena();

  // exit
  if (isAuth() && L.exit && exitOpen() && overlap(p, L.exit)) levelClear();
}

const exitOpen = () => !L.bossReq || L.cleared;

function levelClear() {
  if (state !== 'play') return;
  state = 'clear'; clearT = 0; aim.down = false;
  L.bonus = P.hp * 100;
  score += L.bonus;
  L.lifeGain = !net.on && levelIndex >= 3 && lives < 5;
  if (L.lifeGain) lives++;
  saveBest();
  ebullets.length = 0;
  sfx.clear();
}

function updateEnemy(e, dt) {
  e.t += dt;
  if (e.flash > 0) e.flash -= dt;
  if (e.td) { updateTDEnemy(e, dt); return; }
  const ecx = e.x + e.w / 2, ecy = e.y + e.h / 2;
  const tg = nearestTarget(ecx, ecy);
  const pcx = tg.x + 11, pcy = tg.y + 18;
  const dx = pcx - ecx, dy = pcy - ecy;

  if (e.type === 'crawler') {
    const near = !tg.dead && Math.abs(dx) < 220 && Math.abs(dy) < 60;
    const sp = ((near && Math.sign(dx) === e.dir) ? 105 : 55) * e.spd;
    e.vy = Math.min(MAXFALL, e.vy + GRAV * dt);
    e.hitX = false;
    moveX(e, e.dir * sp * dt);
    if (e.hitX) e.dir *= -1;
    e.onGround = false;
    moveY(e, e.vy * dt);
    if (e.onGround) {
      const fx = e.dir > 0 ? e.x + e.w + 4 : e.x - 4;
      const below = tileAt(Math.floor(fx / TS), Math.floor((e.y + e.h + 4) / TS));
      const front = tileAt(Math.floor(fx / TS), Math.floor((e.y + e.h - 6) / TS));
      if (below !== 1 || front === 2) e.dir *= -1;
    }
    if (e.y > L.h * TS + 100) e.dead = true;
  } else if (e.type === 'turret') {
    const near = !tg.dead && Math.abs(dx) < 470 && Math.abs(dy) < 320;
    e.ang = Math.atan2(dy, dx);
    if (near) {
      e.cool -= dt;
      if (e.cool <= 0) {
        e.cool = 2.1 * e.cdm;
        ebullet(ecx + Math.cos(e.ang) * 16, ecy + Math.sin(e.ang) * 16, e.ang, 230);
        sfx.eshoot();
      }
    } else e.cool = Math.max(e.cool, 0.8);
  } else if (e.type === 'charger') {
    /* patrols, winds up when you are in line, then dashes (it stops at walls and ledges) */
    e.vy = Math.min(MAXFALL, e.vy + GRAV * dt);
    const m = e.mode | 0;
    let sp = 0;
    e.hitX = false;
    if (m === 0) {
      sp = 45 * e.spd;
      if (!tg.dead && e.onGround && Math.abs(dy) < 70 && Math.abs(dx) < 380 && Math.sign(dx) === e.dir) { e.mode = 1; e.mt = 0.55 * e.cdm; }
    } else if (m === 1) { e.mt -= dt; if (e.mt <= 0) { e.mode = 2; e.mt = 0.75; } }
    else if (m === 2) { sp = 330 * e.spd; e.mt -= dt; if (e.mt <= 0) { e.mode = 3; e.mt = 0.9; } }
    else { e.mt -= dt; if (e.mt <= 0) e.mode = 0; }
    moveX(e, e.dir * sp * dt);
    if (e.hitX) { if (m === 2) { e.mode = 3; e.mt = 0.9; } else if (m === 0) e.dir *= -1; }
    e.onGround = false;
    moveY(e, e.vy * dt);
    if (e.onGround && (m === 0 || m === 2)) {
      const fx = e.dir > 0 ? e.x + e.w + 4 : e.x - 4;
      const below = tileAt(Math.floor(fx / TS), Math.floor((e.y + e.h + 4) / TS));
      const front = tileAt(Math.floor(fx / TS), Math.floor((e.y + e.h - 6) / TS));
      if (below !== 1 || front === 2) { if (m === 2) { e.mode = 3; e.mt = 0.9; } else e.dir *= -1; }
    }
    e.ang = e.mode === 1 ? 1 : e.mode === 2 ? 2 : 0;
    if (e.y > L.h * TS + 100) e.dead = true;
  } else if (e.type === 'sniper') {
    /* a slow, accurate shot after a lock-on; its laser sight shows when it has you */
    e.ang = Math.atan2(dy, dx);
    const near = !tg.dead && Math.abs(dx) < 640 && Math.abs(dy) < 360 && los(ecx, ecy, pcx, pcy);
    if (near) {
      if (e.dir !== 1) { e.dir = 1; e.cool = Math.max(e.cool, 1.0); }
      e.cool -= dt;
      if (e.cool <= 0) { e.cool = 2.8 * e.cdm; ebullet(ecx + Math.cos(e.ang) * 18, ecy + Math.sin(e.ang) * 18, e.ang, 380); sfx.eshoot(); }
    } else { e.dir = -1; e.cool = Math.max(e.cool, 1.0); }
  } else if (e.type === 'bomber') {
    /* hunts for a spot above you and drops bombs straight down */
    const near = !tg.dead && Math.abs(dx) < 520 && Math.abs(dy) < 420;
    const tvx = near ? clamp(dx * 1.5, -130, 130) : Math.sin(e.t * 0.8) * 40;
    const tvy = near ? clamp((tg.y - 150 + Math.sin(e.t * 2) * 20 - e.y) * 2, -90, 90) : Math.cos(e.t * 1.3) * 20;
    e.vx += (tvx - e.vx) * Math.min(1, dt * 3);
    e.vy += (tvy - e.vy) * Math.min(1, dt * 3);
    e.hitX = false;
    moveX(e, e.vx * dt);
    moveY(e, e.vy * dt);
    e.y = clamp(e.y, 8, L.h * TS - 60);
    if (near && Math.abs(dx) < 40 && dy > 20) {
      e.cool -= dt;
      if (e.cool <= 0) { e.cool = 1.5 * e.cdm; ebullet(ecx, ecy + 10, Math.PI / 2, 250); sfx.eshoot(); }
    }
  } else {
    const near = !tg.dead && Math.abs(dx) < 440 && Math.abs(dy) < 340;
    let tvx, tvy;
    if (near) {
      tvx = Math.sign(dx) * 85;
      tvy = clamp((tg.y - 70 + Math.sin(e.t * 3) * 26 - e.y) * 2, -90, 90);
    } else {
      tvx = Math.sin(e.t * 0.9) * 35; tvy = Math.cos(e.t * 1.7) * 30;
    }
    e.vx += (tvx - e.vx) * Math.min(1, dt * 3);
    e.vy += (tvy - e.vy) * Math.min(1, dt * 3);
    e.hitX = false;
    moveX(e, e.vx * dt);
    moveY(e, e.vy * dt);
    e.y = clamp(e.y, 8, L.h * TS - 60);
    if (near) {
      e.cool -= dt;
      if (e.cool <= 0) { e.cool = 2.6 * e.cdm; ebullet(ecx, ecy + 8, Math.atan2(dy, dx), 200); sfx.eshoot(); }
    }
  }

  enemyContact(e);
}

/* touching an enemy: stomp it or get hurt. Each player checks this for their own ship. */
function enemyContact(e) {
  if (e.dead || P.dead || !overlap(P, e)) return;
  const ecx = e.x + e.w / 2;
  const stomp = e.type !== 'turret' && e.type !== 'sniper' && P.vy > 80 && (P.y + P.h) - e.y < 20;
  if (stomp) {
    damageEnemy(e, 2);
    P.vy = -460; P.coyote = 0; P.jumping = true;
    sfx.stomp(); spark(ecx, e.y);
  } else hurtPlayer(1, ecx);
}
function bossContact() {
  const b = boss;
  if (!b || b.hidden || b.state !== 'fight' || P.dead) return;
  if (overlap(P, { x: b.x + 8, y: b.y + 8, w: b.w - 16, h: b.h - 12 })) hurtPlayer(1, b.x + b.w / 2);
}

function updateBoss(dt) {
  const b = boss;
  if (!b) return;
  b.t += dt;
  if (b.flash > 0) b.flash -= dt;
  const ax = L.arena.x * TS;

  if (b.state === 'enter') {
    b.y += (b.homeY - b.y) * Math.min(1, dt * 1.8);
    if (b.t > 2.4) { b.state = 'fight'; b.cool = 0.8; }
    return;
  }
  if (b.state === 'dead') {
    b.deadT += dt;
    b.y += 40 * dt;
    if (!b.hidden) {
      if (Math.random() < 0.6) burst(b.x + rand(0, b.w), b.y + rand(0, b.h), 4, '#ffb14a', 240, 0.7, 5);
      shake = Math.max(shake, 6);
    }
    if (b.deadT > 2.6 && !b.hidden) {
      b.hidden = true; L.cleared = true;
      burst(b.x + b.w / 2, b.y + b.h / 2, 60, '#ffd27a', 520, 1.1, 6);
      burst(b.x + b.w / 2, b.y + b.h / 2, 40, '#ff5a4a', 420, 1.1, 6);
      shake = 16; sfx.boom();
      for (let i = 0; i < 8; i++) dropItem('scrap', b.x + b.w / 2 + rand(-40, 40), b.y + b.h / 2);
      showBanner('VAULT OPEN', 'REACH THE EXIT', 2.8);
    }
    return;
  }

  if (b.type !== 'warden') { bossAI(b, dt, ax); bossContact(); return; }
  const fast = b.hp < b.maxhp * 0.5;
  const range = (VW - b.w) / 2 - 30;
  const tx = ax + VW / 2 - b.w / 2 + Math.sin(b.t * (fast ? 0.95 : 0.7)) * range;
  b.x += (tx - b.x) * Math.min(1, dt * 3.2);
  b.y += (96 + Math.sin(b.t * 1.7) * 16 - b.y) * Math.min(1, dt * 4);

  if (!allDead()) b.cool -= dt;
  if (b.cool <= 0) {
    const pat = b.pat++ % 3;
    const cx = b.x + b.w / 2, cy = b.y + b.h - 10;
    if (pat === 0) {
      const tg = nearestTarget(cx, cy);
      const a = Math.atan2(tg.y + 18 - cy, tg.x + 11 - cx);
      for (let i = -1; i <= 1; i++) ebullet(cx, cy, a + i * 0.22, 260);
      if (fast) { ebullet(cx, cy, a - 0.44, 260); ebullet(cx, cy, a + 0.44, 260); }
      b.cool = (fast ? 1.1 : 1.6) * (L.bossCd || 1);
    } else if (pat === 1) {
      const n = fast ? 14 : 10, off = Math.random() * 6.283;
      for (let i = 0; i < n; i++) ebullet(cx, cy, off + i * 6.283 / n, 190);
      b.cool = (fast ? 1.4 : 1.9) * (L.bossCd || 1);
    } else {
      b.rain = (fast ? 9 : 6) + Math.floor(L.diff / 4 || 0); b.rainT = 0; b.cool = 2.8 * (L.bossCd || 1);
    }
    sfx.eshoot();
  }
  if (b.rain > 0) {
    b.rainT -= dt;
    if (b.rainT <= 0) {
      b.rainT = 0.22; b.rain--;
      ebullet(ax + rand(40, VW - 40), -10, Math.PI / 2, 240);
    }
  }
  bossContact();
}

/* minions the bosses call in; they get ids from 100000 up so guests can build them from the snapshot */
function spawnDyn(type, x, y, ground) {
  const e = makeEnemy({ type, tx: 0, ty: 0, dd: 0 }, 100000 + (L.dyn = (L.dyn || 0) + 1));
  e.x = x - e.w / 2; e.y = ground ? 14 * TS - e.h : y; e.dyn = true; enemies.push(e);
  burst(x, e.y + 8, 10, '#8de05a', 180, 0.4, 3, 0);
  return e;
}
const aliveDyn = () => enemies.filter(e => e.dyn && !e.dead).length;
function bossAI(b, dt, ax) {
  const fast = b.hp < b.maxhp * 0.5, cd = L.bossCd || 1;
  const cx = b.x + b.w / 2, cy = b.y + b.h / 2, tg = nearestTarget(cx, cy);
  const aim = (x, y) => Math.atan2(tg.y + 18 - y, tg.x + 11 - x);
  const lo = ax + 6, hi = ax + VW - b.w - 6;
  if (b.type === 'hive') {
    const tx = ax + VW / 2 - b.w / 2 + Math.sin(b.t * (fast ? 0.9 : 0.65)) * ((VW - b.w) / 2 - 30);
    b.x += (tx - b.x) * Math.min(1, dt * 2.6);
    b.y += (84 + Math.sin(b.t * 1.3) * 26 - b.y) * Math.min(1, dt * 3);
    if (!allDead()) b.cool -= dt;
    if (b.cool <= 0) {
      const pat = b.pat++ % 3;
      if (pat === 0) {
        const n = Math.min(fast ? 3 : 2, 6 - aliveDyn());
        for (let i = 0; i < n; i++) spawnDyn('drone', cx + (i - (n - 1) / 2) * 44, b.y + b.h);
        b.cool = 2.0 * cd;
      } else if (pat === 1) {
        const a = aim(cx, b.y + b.h - 8);
        for (let i = -2; i <= 2; i++) ebullet(cx, b.y + b.h - 8, a + i * 0.16, 250);
        b.cool = (fast ? 1.2 : 1.6) * cd;
      } else { b.rain = fast ? 10 : 7; b.rainT = 0; b.cool = 2.6 * cd; }
      sfx.eshoot();
    }
    if (b.rain > 0) {
      b.rainT -= dt;
      if (b.rainT <= 0) { b.rainT = 0.2; b.rain--; ebullet(ax + 40 + Math.random() * (VW - 80), -10, Math.PI / 2, 230); }
    }
  } else if (b.type === 'walker') {
    const floorY = 14 * TS - b.h;
    if (b.mode === 'walk') {
      b.y += (floorY - b.y) * Math.min(1, dt * 8);
      b.x = clamp(b.x + (tg.x > cx ? 1 : -1) * (fast ? 74 : 52) * dt, lo, hi);
      if (!allDead()) b.cool -= dt;
      if (b.cool <= 0) {
        const pat = b.pat++ % 3;
        if (pat === 0) { b.mode = 'jump'; b.vy = -640; b.jx = (tg.x + 11 - cx) * 0.9; }
        else if (pat === 1) {
          const n = fast ? 5 : 3, a = aim(cx, b.y + 14);
          for (let i = 0; i < n; i++) ebullet(cx, b.y + 14, a + (i - (n - 1) / 2) * 0.2, 270);
          b.cool = 1.5 * cd; sfx.eshoot();
        } else { b.mode = 'charge'; b.mt = 0; b.cdir = tg.x > cx ? 1 : -1; }
      }
    } else if (b.mode === 'jump') {
      b.vy += 1500 * dt; b.y += b.vy * dt;
      b.x = clamp(b.x + b.jx * dt * 1.4, lo, hi);
      if (b.y >= floorY && b.vy > 0) {
        b.y = floorY; b.mode = 'walk'; b.cool = (fast ? 1.0 : 1.5) * cd; shake = Math.max(shake, 9); sfx.boom();
        const fy = 14 * TS - 12;
        ebullet(b.x + 10, fy, Math.PI, 300); ebullet(b.x + b.w - 10, fy, 0, 300);
        if (fast) { ebullet(b.x + 10, fy - 26, Math.PI, 230); ebullet(b.x + b.w - 10, fy - 26, 0, 230); }
      }
    } else {
      b.mt += dt; b.cool = 0.1;
      b.y += (floorY - b.y) * Math.min(1, dt * 8);
      if (b.mt > 0.7) {
        b.x += b.cdir * (fast ? 430 : 360) * dt;
        if (b.x <= lo || b.x >= hi) { b.x = clamp(b.x, lo, hi); b.mt = 9; shake = Math.max(shake, 7); }
      }
      if (b.mt > 2.2) { b.mode = 'walk'; b.cool = 1.4 * cd; }
    }
  } else {
    const ph = b.hp < b.maxhp * 0.33 ? 3 : b.hp < b.maxhp * 0.66 ? 2 : 1;
    const tx = ax + VW / 2 - b.w / 2 + Math.sin(b.t * (0.3 + ph * 0.1)) * 150;
    b.x += (tx - b.x) * Math.min(1, dt * 2);
    b.y += (64 + Math.sin(b.t * 1.1) * 14 - b.y) * Math.min(1, dt * 3);
    if (!allDead()) b.cool -= dt;
    if (b.spi > 0) {
      b.spiT -= dt;
      if (b.spiT <= 0) { b.spiT = 0.085; b.spi--; b.spa += 0.5; ebullet(cx, cy, b.spa, 205); if (ph === 3) ebullet(cx, cy, b.spa + Math.PI, 205); }
    }
    if (b.cool <= 0) {
      const pat = b.pat++ % 4;
      if (pat === 0) { b.spi = 20 + ph * 4; b.spiT = 0; b.cool = 3.4 * cd; }
      else if (pat === 1) { const n = 10 + ph * 3, off = Math.random() * 6.283; for (let i = 0; i < n; i++) ebullet(cx, cy, off + i * 6.283 / n, 185); b.cool = 1.7 * cd; }
      else if (pat === 2) {
        if (aliveDyn() < 4) { spawnDyn('crawler', ax + 50, 0, true); spawnDyn('crawler', ax + VW - 50, 0, true); }
        if (ph >= 2 && aliveDyn() < 5) spawnDyn('drone', cx, b.y + b.h);
        b.cool = 2.2 * cd;
      } else { const n = 3 + ph, a = aim(cx, cy); for (let i = 0; i < n; i++) ebullet(cx, cy, a + (i - (n - 1) / 2) * 0.14, 300); b.cool = 1.4 * cd; }
      sfx.eshoot();
    }
  }
}

function hitBoss(b, dmg, who) {
  const bs = boss;
  if (bs.state !== 'fight') { spark(b.x, b.y); return; }
  if (net.on && !net.isHost) {
    net.hq.set('b', (net.hq.get('b') || 0) + dmg);
    bs.flash = 0.08; spark(b.x, b.y); sfx.hit();
    return;
  }
  bs.hp -= dmg; bs.flash = 0.08; spark(b.x, b.y); sfx.hit();
  const ax = L.arena.x * TS;
  if (!bs.d1 && bs.hp <= bs.maxhp * 0.5) { bs.d1 = true; dropItem('med', ax + VW / 2, 60); }
  if (!bs.d2 && bs.hp <= bs.maxhp * 0.25) { bs.d2 = true; dropItem('med', ax + VW / 2, 60); }
  if (bs.hp <= 0) {
    bs.hp = 0; bs.state = 'dead'; bs.deadT = 0;
    ebullets.length = 0;
    for (const e of enemies) if (e.dyn) e.dead = true;
    award(who, 1000);
    shake = 12; sfx.boom();
  }
}

function updateBullets(dt) {
  for (const b of bullets) {
    if (b.kind === 6) { stepGrenade(b, dt, false); continue; }
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.kind === 3) b.r = 5 + (0.36 - b.life) * 22;
    else if (b.kind === 4 && Math.random() < 0.7) burst(b.x - b.vx * 0.02, b.y - b.vy * 0.02, 1, '#9aa1ab', 50, 0.35, 4, -30);
    if (b.life <= 0) { if (b.kind === 4) explode(b); continue; }
    if (b.y < -80 || b.y > VH + 40) { b.life = 0; continue; }
    if (solidAt(Math.floor(b.x / TS), Math.floor(b.y / TS))) {
      if (b.kind === 4) explode(b); else if (b.kind !== 3) spark(b.x, b.y);
      b.life = 0; continue;
    }
    if (b.pierce && !b.hit) b.hit = new Set();
    for (const e of enemies) {
      if (e.dead || (b.hit && b.hit.has(e))) continue;
      if (b.x > e.x - b.r && b.x < e.x + e.w + b.r && b.y > e.y - b.r && b.y < e.y + e.h + b.r) {
        if (b.kind === 4) { explode(b); b.life = 0; break; }
        damageEnemy(e, b.dmg);
        if (b.kind !== 3) spark(b.x, b.y);
        if (b.pierce > 0) { b.hit.add(e); b.pierce--; } else { b.life = 0; break; }
      }
    }
    if (b.life > 0 && boss && !boss.hidden && boss.state !== 'dead' && !(b.hit && b.hit.has('b'))) {
      if (b.x > boss.x && b.x < boss.x + boss.w && b.y > boss.y && b.y < boss.y + boss.h) {
        if (b.kind === 4) { explode(b); b.life = 0; }
        else { hitBoss(b, b.dmg); if (b.pierce > 0) { b.hit.add('b'); b.pierce--; } else b.life = 0; }
      }
    }
  }
  bullets = bullets.filter(b => b.life > 0);

  for (const b of ebullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.life <= 0 || b.y < -120 || b.y > VH + 40) { b.life = 0; continue; }
    if (L.td && L.core && b.x > L.core.x && b.x < L.core.x + L.core.w && b.y > L.core.y && b.y < L.core.y + L.core.h) {
      if (isAuth()) { L.core.hp -= 3; L.core.flash = 0.1; }
      spark(b.x, b.y); b.life = 0; continue;
    }
    if (solidAt(Math.floor(b.x / TS), Math.floor(b.y / TS))) { spark(b.x, b.y); b.life = 0; continue; }
    if (!P.dead && b.x > P.x - b.r && b.x < P.x + P.w + b.r && b.y > P.y - b.r && b.y < P.y + P.h + b.r) {
      b.life = 0; hurtPlayer(1, b.x);
      if (net.on && !net.isHost) { net.consumed.add(b.id); netEmit('ebh', { id: b.id }); }
    }
  }
  ebullets = ebullets.filter(b => b.life > 0);
}

function updateItems(dt) {
  const p = P;
  for (const it of items) {
    if (it.got) continue;
    if (it.phys) {
      it.vy = Math.min(600, it.vy + 1400 * dt);
      const ny = it.y + it.vy * dt;
      if (it.vy > 0 && solidAt(Math.floor(it.x / TS), Math.floor((ny + 8) / TS))) {
        it.y = Math.floor((ny + 8) / TS) * TS - 8; it.vy = 0; it.phys = false;
      } else it.y = ny;
      if (it.y > L.h * TS + 40) it.got = true;
    }
    if (p.dead) continue;
    if (Math.abs(p.x + p.w / 2 - it.x) < 22 && Math.abs(p.y + p.h / 2 - it.y) < 26) {
      it.got = true;
      if (net.on) netEmit(net.isHost ? 'gone' : 'pick', { id: it.id });
      if (it.type === 'scrap') {
        score += 10; L.scrapGot++; cells = Math.min(999, cells + 1); sfx.pick(); burst(it.x, it.y, 5, '#ffcf5a', 120, 0.3, 3, 0);
      } else if (it.type === 'med') {
        if (p.hp < p.maxhp) { p.hp = Math.min(p.maxhp, p.hp + 2); showBanner('HULL REPAIRED', '', 1.2); }
        else score += 25;
        sfx.pick(); burst(it.x, it.y, 8, '#9be15d', 160, 0.4, 3, 0);
      } else if (it.type === 'gun') {
        const k = it.k, W = WEAPONS[k], add = it.drop ? Math.ceil(W.ammo / 2) : W.ammo, had = ammo[k] > 0;
        ammo[k] = Math.min(ammoCap(k), Math.max(0, ammo[k]) + add);
        if (!had || wpn === 0) wpn = k;
        note(W.name + ' +' + add);
        sfx.power(); burst(it.x, it.y, 14, W.col, 220, 0.5, 3, 0);
      } else if (it.type === 'weapon') {
        if (wLevel < 3) { wLevel++; showBanner('WEAPON UPGRADE', wLevel === 2 ? 'TWIN CANNON' : 'TRI-SPREAD', 1.8); }
        else score += 100;
        sfx.power(); burst(it.x, it.y, 16, '#43d9e8', 240, 0.6, 3, 0);
      }
    }
  }
  if (L.endless) for (const it of items) if (it.got && it.id < 1e8) L.taken.add(it.id);
  items = items.filter(it => !it.got);
}

function updateParts(dt) {
  for (const a of arcs) a.t -= dt;
  arcs = arcs.filter(a => a.t > 0);
  for (const q of parts) { q.life -= dt; q.vy += q.g * dt; q.x += q.vx * dt; q.y += q.vy * dt; }
  parts = parts.filter(q => q.life > 0);
}

function updateCamera(dt) {
  let t, f = P;
  if (net.on && P.dead) { for (const r of net.remotes.values()) if (r.tx !== undefined && !r.dead) { f = r; break; } }
  if (L.sealed) t = L.arena.x * TS;
  else if (L.endless) t = f.x + 11 - VW / 2 + (f.face || 1) * 30;
  else t = clamp(f.x + 11 - VW / 2 + (f.face || 1) * 30, 0, L.w * TS - VW);
  cam.x += (t - cam.x) * Math.min(1, dt * 7);
}

function updatePlay(dt) {
  L.time += dt;
  streamChunks();
  updatePlayer(dt);
  if (state !== 'play') return;
  for (const e of enemies) if (!e.dead) updateEnemy(e, dt);
  enemies = enemies.filter(e => !e.dead);
  if (L.td) tdStep(dt);
  updateBoss(dt);
  updateTurrets(dt);
  updateBullets(dt);
  updateItems(dt);
  if (net.on) netHostStep(dt);
  updateParts(dt);
  updateCamera(dt);
  endlessStep();
  if (toast.t > 0) toast.t -= dt;
  if (banner) { banner.t += dt; if (banner.t > banner.dur) banner = null; }
  if (shake > 0) shake = Math.max(0, shake - 40 * dt);
}

function updatePlayClient(dt) {
  L.time += dt;
  streamChunks();
  updatePlayer(dt);
  if (state !== 'play') return;
  netClientWorld(dt);
  updateTurrets(dt);
  updateBullets(dt);
  updateItems(dt);
  updateParts(dt);
  updateCamera(dt);
  endlessStep();
  if (toast.t > 0) toast.t -= dt;
  if (banner) { banner.t += dt; if (banner.t > banner.dur) banner = null; }
  if (shake > 0) shake = Math.max(0, shake - 40 * dt);
}

function step(dt) {
  time += dt;
  if (state === 'title') return;
  const client = net.on && !net.isHost;
  if (state === 'play') {
    if (just.pause && !net.on) { state = 'paused'; return; }
    if (client) updatePlayClient(dt); else updatePlay(dt);
    if (net.on) netRemotesStep(dt);
  } else if (state === 'paused') {
    if (just.pause || just.start) state = 'play';
  } else if (state === 'clear') {
    clearT += dt;
    updateParts(dt);
    if (clearT > 0.8 && just.start && !client) {
      if (net.on) netHostNext();
      else if (levelIndex === LEVELS.length - 1) { state = 'win'; clearT = 0; }
      else { loadLevel(levelIndex + 1); state = 'play'; }
    }
  } else if (state === 'over') {
    clearT += dt;
    updateParts(dt);
    if (clearT > 0.9 && just.start && !client) {
      if (net.on) netHostNext();
      else { score = scoreAtLevelStart; lives = 3; wLevel = 1; resetLoadout(levelIndex); loadLevel(levelIndex); state = 'play'; }
    }
  } else if (state === 'win') {
    clearT += dt;
    if (clearT > 0.8 && just.start && !client) {
      if (net.on) netHostNext();
      else { lives = Math.max(lives, 3); loadLevel(LEVELS.length); state = 'play'; }
    }
  }
}

/* ================= online co-op ================= */
/* One player hosts a room. The host runs enemies, the boss and item drops and publishes them
   through its room presence (about 15 times a second). Everyone else simulates only their own
   ship, shows what the host publishes, and reports hits, pickups and checkpoints back to it.
   Sector layouts match for everyone because they are built from a seed the host shares. */
const PAL = [['#43d9e8', '#ff7a2f'], ['#9be15d', '#2f9e44'], ['#ff5ab0', '#b0206a'], ['#ffd27a', '#c27a00'], ['#b58cff', '#6a46b0'], ['#ff6b5a', '#8a2a20']];
const PRES_MS = 66;
const clean = (v, n) => String(v == null ? '' : v).replace(/[\u0000-\u001f\u007f<>]/g, '').trim().slice(0, n);
const num = (v, a, b) => { v = +v; return v === v ? clamp(v, a, b) : 0; };

function netEmit(topic, data) {
  if (!net.rm) return;
  try {
    net.rm.emit(topic, data).catch(e => {
      if (e && e.code === 'not_permitted') netStatus('You can watch this room but not play. Ask the owner for Contributor access.');
    });
  } catch (_) {}
}
/* everyone in the room, one entry per player (my other tabs are left out) */
const netPlayers = () => net.rm ? net.rm.peers().filter(q => q.kind === 'viewer' && (!q.isMe || q.sameTab)) : [];
const netCount = () => Math.max(1, netPlayers().length);
function netRoster() {
  const ps = netPlayers();
  const ids = ps.map(q => q.peer).sort();
  return ps.map(q => ({
    id: q.peer, nm: clean(q.presence.nm, 12) || 'Player', host: q.presence.rl === 'h', me: q.isMe,
    ci: ids.indexOf(q.peer) % PAL.length,
  })).sort((a, b) => (b.host - a.host) || (a.id < b.id ? -1 : 1));
}

/* ---------- lobby UI ---------- */
function netStatus(t) { const el = $('lobbyMsg'); if (el) el.textContent = t || ''; }
function openLobby() { net.panel = true; netUi(true); if (!net.avail) netStatus('Online co-op needs this page open inside Claude, signed in, with live-room access.'); }
function netUi(force) {
  const ro = net.on ? netRoster() : [];
  const key = [net.on, net.isHost, net.panel, state === 'title', net.code, ro.map(q => q.nm + q.host + q.me + q.ci).join('|')].join('~');
  if (!force && key === net.rosterKey) return;
  net.rosterKey = key;
  $('lobby').hidden = !(net.panel || net.on);
  $('lobbySetup').hidden = net.on;
  $('lobbyRoom').hidden = !net.on;
  $('hostRow').hidden = !(net.on && net.isHost && state === 'title');
  $('roomTitle').textContent = net.on ? 'Room ' + net.code.toUpperCase() + (net.isHost ? ' (you host)' : '') : '';
  const ul = $('roster');
  ul.textContent = '';
  for (const q of ro) {
    const li = document.createElement('li');
    const sw = document.createElement('span'); sw.className = 'sw'; sw.style.background = PAL[q.ci][0];
    const tx = document.createElement('span'); tx.textContent = q.nm + (q.host ? ' (host)' : '') + (q.me ? ' (you)' : '');
    li.appendChild(sw); li.appendChild(tx); ul.appendChild(li);
  }
}

/* ---------- joining and leaving ---------- */
async function netJoin(codeRaw, asHost) {
  if (!net.lib) { openLobby(); return; }
  const code = String(codeRaw || '').toLowerCase().replace(/[^a-z0-9]/g, '').slice(0, 8);
  if (code.length < 3) { netStatus('Enter a room code with 3 to 8 letters or numbers.'); return; }
  net.name = clean($('nick').value, 12) || 'Runner';
  try { localStorage.setItem('slagrunner.name', net.name); } catch (_) {}
  netStatus('Connecting...');
  let rm;
  try { rm = await net.lib.join('sr-' + code); }
  catch (e) { netStatus('Could not join the room' + (e && e.code ? ' (' + e.code + ')' : '') + '. Try again.'); return; }
  if (net.on) { try { rm.leave(); } catch (_) {} return; }
  if (state !== 'title') { state = 'title'; loadLevel(0); banner = null; }
  aim.down = false;
  Object.assign(net, { rm, code, isHost: !!asHost, on: true, me: null, ep: 0, g: null, noHost: 0, fn: 0, lastPres: 0, mode: 0 });
  net.remotes.clear(); net.hq.clear();
  const bad = e => netLeave('Lost the connection to the room (' + (e && e.code) + ').');
  net.unsub = [
    rm.on('hit', onHit, bad), rm.on('pick', onPick, bad), rm.on('chk', onChk, bad), rm.on('ebh', onEbh, bad),
    rm.on('pts', onPts, bad), rm.on('drop', onDrop, bad), rm.on('gone', onGone, bad),
  ];
  rm.presence({ nm: net.name, rl: asHost ? 'h' : 'p' }).catch(() => {});
  netStatus(asHost ? 'Room open. Share the code ' + code.toUpperCase() + ' with your friends, then pick a mode.' : 'Joined room ' + code.toUpperCase() + '. Waiting for the host to start.');
  netUi(true);
}
function netLeave(msg) {
  for (const u of net.unsub) { try { u(); } catch (_) {} }
  net.unsub = [];
  const rm = net.rm;
  net.rm = null; net.on = false; net.isHost = false; net.g = null; net.ep = 0; net.me = null;
  net.remotes.clear(); net.rb = []; net.hq.clear();
  if (rm) { try { const r = rm.leave(); if (r && r.catch) r.catch(() => {}); } catch (_) {} }
  aim.down = false;
  if (state !== 'title') { state = 'title'; loadLevel(0); banner = null; }
  netStatus(msg || 'You left the room.');
  netUi(true);
}

/* ---------- what I publish ---------- */
function netPresence(now) {
  if (!net.rm || now - net.lastPres < PRES_MS) return;
  net.lastPres = now;
  const o = { nm: net.name, rl: net.isHost ? 'h' : 'p' };
  if (state !== 'title' && L) {
    o.x = Math.round(P.x); o.y = Math.round(P.y); o.a = Math.round(P.ang * 100) / 100;
    o.gr = P.onGround ? 1 : 0; o.vx = Math.round(P.vx); o.hp = P.hp; o.dd = P.dead ? 1 : 0;
    o.iv = P.inv > 0 ? 1 : 0; o.sc = score; o.wl = wLevel; o.fn = net.fn; o.wk = wpn;
    o.tu = turrets.filter(t => !t.held).map(t => [Math.round(t.x), Math.round(t.y), Math.round(t.ang * 100), t.ammo, t.type | 0]);
  } else { o.x = null; }
  if (net.isHost) {
    const g = {
      ph: state === 'title' ? 'lobby' : state === 'paused' ? 'play' : state, lv: levelIndex, ep: net.ep, rt: net.rt ? 1 : 0,
      sd: net.seed, md: net.mode, sl: L && L.sealed ? 1 : 0, cl: L && L.cleared ? 1 : 0, ck: 0, li: lives,
    };
    if (L && !L.endless) L.checks.forEach((c, i) => { if (c.on) g.ck |= 1 << i; });
    if (L && L.td) {
      const c = L.core, ts = L.tdst;
      g.cr = Math.round(c.hp); g.cm = c.max; g.tw = ts.w; g.ts = ts.st === 'wave' ? 1 : 0; g.tt = Math.ceil(Math.max(0, ts.t));
      g.tl = ts.q.length + enemies.filter(e => !e.dead && e.td).length;
    }
    o.g = g;
    if (state === 'play') {
      const xs = allPlayers().filter(q => !q.dead).map(q => q.x);
      const near = L.td ? () => true : q => xs.length === 0 || xs.some(x => Math.abs(x - q.x) < 1300);
      o.e = enemies.filter(e => !e.dead && near(e)).slice(0, 40)
        .map(e => [e.id, Math.round(e.x), Math.round(e.y), e.hp, e.dir, Math.round(e.ang * 100), ETYPES.indexOf(e.type)]);
      o.eb = ebullets.filter(near).slice(0, L.td ? 24 : 40)
        .map(b => [b.id, Math.round(b.x), Math.round(b.y), Math.round(b.vx), Math.round(b.vy)]);
      o.bs = boss ? [Math.round(boss.x), Math.round(boss.y), boss.hp, boss.maxhp,
        boss.state === 'enter' ? 0 : boss.state === 'fight' ? 1 : 2, boss.hidden ? 1 : 0, boss.cool < 0.3 ? 1 : 0] : null;
    } else { o.e = null; o.eb = null; o.bs = null; }
  }
  net.rm.presence(o).catch(() => {});
}

/* ---------- what I read, every frame ---------- */
function netFrame(dt, now) {
  if (!net.rm) return;
  const ps = netPlayers();
  const ids = ps.map(q => q.peer).sort();
  const seen = new Set();
  let hostP = null;
  for (const q of ps) {
    if (q.isMe) { net.me = q.peer; net.ci = ids.indexOf(q.peer) % PAL.length; continue; }
    const pr = q.presence;
    if (pr.rl === 'h') hostP = q;
    seen.add(q.peer);
    let r = net.remotes.get(q.peer);
    if (!r) {
      r = { id: q.peer, x: 0, y: 0, w: 22, h: 36, vx: 0, tvx: 0, ang: 0, onGround: true, anim: 0, landT: 0, recoil: 0, inv: 0,
        dead: false, face: 1, hp: 5, maxhp: 5, nm: 'Player', sc: 0, wl: 1, fn: 0, ci: 0, wasDead: false, wk: 0, tu: [] };
      net.remotes.set(q.peer, r);
    }
    r.nm = clean(pr.nm, 12) || 'Player';
    r.ci = ids.indexOf(q.peer) % PAL.length;
    if (pr.x != null) {
      if (r.tx === undefined) { r.x = pr.x; r.y = pr.y; r.wasDead = !!pr.dd; r.fn = pr.fn || 0; }
      r.tx = pr.x; r.ty = pr.y; r.ang = pr.a || 0; r.onGround = !!pr.gr; r.tvx = pr.vx || 0;
      r.hp = pr.hp == null ? 5 : pr.hp; r.dead = !!pr.dd; r.inv = pr.iv ? 1 : 0; r.sc = pr.sc || 0; r.wl = pr.wl || 1; r.wk = num(pr.wk, 0, NW - 1) | 0; netRemoteTurrets(r, pr.tu);
      r.face = Math.cos(r.ang) >= 0 ? 1 : -1;
      if ((pr.fn || 0) !== r.fn) { r.fn = pr.fn || 0; netRemoteFire(r); }
    } else r.tx = undefined;
  }
  for (const id of [...net.remotes.keys()]) if (!seen.has(id)) net.remotes.delete(id);

  if (!net.isHost) {
    if (hostP) net.noHost = 0; else net.noHost += dt;
    if (net.noHost > 4) { netLeave('There is no host in this room. Check the code, or ask your friend to host again.'); return; }
    if (hostP) netClientSync(hostP.presence);
  }
  netFlushHits(now);
  net.rosterT -= dt;
  if (net.rosterT <= 0) { net.rosterT = 0.4; netUi(false); }
}

/* follow the host: which sector, which phase, which checkpoints, enemies, boss */
function netClientSync(pr) {
  const g = pr.g;
  if (!g) return;
  net.g = g; lives = g.li;
  if (g.ph === 'lobby') {
    if (state !== 'title') { state = 'title'; aim.down = false; loadLevel(0); banner = null; }
    net.ep = 0;
    return;
  }
  if (g.ep !== net.ep || state === 'title') {
    net.ep = g.ep; net.seed = g.sd; net.mode = g.md;
    if (state === 'title') { score = 0; wLevel = 1; resetLoadout(g.lv); }
    else if (g.rt) { score = scoreAtLevelStart; wLevel = 1; resetLoadout(g.lv); }
    net.hq.clear();
    loadLevel(g.lv, g.sd);
    state = 'play'; clearT = 0; aim.down = false;
    netUi(true);
  }
  if (g.ph === 'clear' && state === 'play') {
    state = 'clear'; clearT = 0; aim.down = false;
    L.bonus = P.hp * 100; score += L.bonus; L.lifeGain = false;
    saveBest(); ebullets.length = 0; sfx.clear();
  } else if (g.ph === 'over' && (state === 'play' || state === 'clear')) {
    state = 'over'; clearT = 0; aim.down = false; saveBest();
  } else if (g.ph === 'win' && state !== 'win') {
    state = 'win'; clearT = 0;
  }
  if (g.sl && !L.sealed && L.arena) sealArena();
  if (g.cl && !L.cleared) { L.cleared = true; showBanner('VAULT OPEN', 'REACH THE EXIT', 2.8); }
  if (!L.endless) for (let i = 0; i < L.checks.length; i++) {
    const c = L.checks[i];
    if (((g.ck >> i) & 1) && !c.on) { c.on = true; L.respawn = { x: c.rx, y: c.ry }; }
  }
  if (state === 'play' && L.td && g.cr !== undefined) {
    const v = L.tdv, c = L.core;
    if (g.cr < c.hp - 0.5) c.flash = 0.1;
    c.hp = g.cr; c.max = g.cm || c.max;
    if (v.st === 1 && g.ts === 0) tdOnWaveClear(g.tw);
    if (v.st === 0 && g.ts === 1) { showBanner('WAVE ' + g.tw, g.tl + ' HOSTILES INCOMING', 2.2); sfx.warn(); }
    v.w = g.tw; v.st = g.ts; v.t = g.tt; v.left = g.tl;
  }
  if (state === 'play' && g.ep === net.ep) {
    if (pr.e !== net.lastE) { net.lastE = pr.e; netApplyEnemies(pr.e); }
    if (pr.eb !== net.lastEB) { net.lastEB = pr.eb; netApplyEBullets(pr.eb); }
    if (pr.bs !== net.lastBS) { net.lastBS = pr.bs; netApplyBoss(pr.bs); }
  }
}

function netApplyEnemies(list) {
  if (!Array.isArray(list)) return;
  const byId = new Map(enemies.map(e => [e.id, e]));
  const seen = new Set();
  for (const r of list) {
    let e = byId.get(r[0]);
    if (!e) {
      /* Tower Defence waves are spawned by the host on the fly: build them from the snapshot */
      const ty = ETYPES[r[6]], dyn = r[0] >= 100000 && r[0] < 1000000;
      if (!(ty && (L.td || (L.arena && dyn)))) continue;
      e = makeEnemy({ type: ty, tx: 0, ty: 0, dd: 0 }, r[0]);
      if (L.td) e.td = true; else e.dyn = true; e.x = r[1]; e.y = r[2]; e.mhp = Math.max(r[3], ENEMY[ty].hp);
      enemies.push(e); byId.set(e.id, e);
    }
    seen.add(e.id);
    e.tx = r[1]; e.ty = r[2]; e.hp = r[3]; e.dir = r[4]; e.ang = r[5] / 100;
  }
  /* the host lists every living enemy near any player, so one missing near me is dead */
  for (const e of enemies) {
    if (!seen.has(e.id) && (e.td || e.dyn || Math.abs(e.x - P.x) < 800)) { e.dead = true; if (L.endless) L.killed.add(e.id); enemyFx(e); }
  }
  enemies = enemies.filter(e => !e.dead);
}
function netApplyEBullets(list) {
  const byId = new Map(ebullets.map(b => [b.id, b]));
  const out = [];
  for (const r of (Array.isArray(list) ? list : [])) {
    if (net.consumed.has(r[0])) continue;
    const b = byId.get(r[0]) || { id: r[0], r: 5, life: 5 };
    b.x = r[1]; b.y = r[2]; b.vx = r[3]; b.vy = r[4]; b.life = Math.max(b.life, 1);
    out.push(b);
  }
  ebullets = out;
}
function netApplyBoss(bs) {

    ctx.fillStyle = '#4b5a3a'; ctx.fillRect(rc, -5, 16, 10);
    ctx.fillStyle = tip; ctx.fillRect(rc + 16, -4, 4, 8);
  } else if (ty === 3) {
    ctx.fillStyle = '#7a2a1a'; ctx.fillRect(rc, -4, 10, 8);
    ctx.fillStyle = '#2b3038'; ctx.fillRect(rc + 10, -2, 10, 4);
    ctx.fillStyle = tip; ctx.fillRect(rc + 18, -3, 3, 6);
  } else if (ty === 4) {
    ctx.fillStyle = '#2b3038'; ctx.fillRect(rc, -2, 10, 4);
    ctx.fillStyle = tip; ctx.globalAlpha = (ghost ? 0.75 : 1) * (0.6 + 0.4 * Math.sin(time * 12)); ctx.beginPath(); ctx.arc(rc + 14, 0, 5, 0, 6.283); ctx.fill();
    ctx.globalAlpha = ghost ? 0.75 : 1;
  } else {
    ctx.fillStyle = '#2b3038'; ctx.fillRect(rc, -3, 18, 6);
    ctx.fillStyle = tip; ctx.fillRect(rc + 14, -2, 5, 4);
  }
  ctx.restore();
  ctx.fillStyle = empty ? (Math.sin(time * 8) > 0 ? '#ff3b4a' : '#5a1f24') : pal[0]; ctx.fillRect(-2, -5, 4, 3);
  if (!ghost) {
    ctx.fillStyle = '#1b1f26'; ctx.fillRect(-12, -17, 24, 3);
    ctx.fillStyle = col; ctx.fillRect(-12, -17, 24 * clamp(t.ammo / mxa, 0, 1), 3);
  }
  ctx.restore();
}
function drawTurrets() {
  const pal = PAL[net.on ? net.ci : 0];
  for (const t of turrets) if (!t.held) drawTurret(t, pal, false);
  if (carry && !P.dead) { const s = placeSpot(); drawTurret({ x: s.x, y: s.y, ang: carry.ang, ammo: carry.max, max: carry.max, type: carry.type }, pal, true, s.ok); }
  for (const r of net.remotes.values()) if (r.tx !== undefined) for (const t of r.tu) drawTurret(t, PAL[r.ci % PAL.length], false);
}

function drawParts() {
  for (const q of parts) {
    ctx.globalAlpha = clamp(q.life / q.max, 0, 1);
    ctx.fillStyle = q.col;
    ctx.fillRect(q.x - q.size / 2, q.y - q.size / 2, q.size, q.size);
  }
  ctx.globalAlpha = 1;
}

function drawWorld(actors) {
  const sx = shake > 0 ? rand(-shake, shake) * 0.5 : 0, sy = shake > 0 ? rand(-shake, shake) * 0.5 : 0;
  ctx.save();
  ctx.translate(sx, sy);
  drawBG();
  ctx.translate(-Math.round(cam.x), 0);
  drawLiquid();
  drawTiles();
  drawDecor();
  if (actors) {
    drawCore();
    drawItems();
    drawTurrets();
    for (const e of enemies) { drawEnemy(e); if (L.td) drawEnemyBar(e); }
    if (boss) drawBoss(boss);
    drawRemotes();
    drawPlayer();
    drawBullets();
    drawArcs();
  }
  drawParts();
  ctx.restore();
}

function drawHUD() {
  const x = 16, y = 14;
  ctx.fillStyle = 'rgba(8,9,12,0.6)'; ctx.fillRect(x - 8, y - 8, 262, 64);
  T('HULL', x, y + 8, 11, '#8a909b', 'left', true, 2);
  for (let i = 0; i < P.maxhp; i++) { ctx.fillStyle = i < P.hp ? '#ff7a2f' : '#2b2f37'; ctx.fillRect(x + i * 22, y + 14, 18, 9); }
  if (L.td) T('CELLS ' + cells, x, y + 46, 11, '#9be15d', 'left', true, 2); else T('RETRY', x, y + 46, 11, '#8a909b', 'left', true, 2);
  ctx.fillStyle = '#d8dde3';
  for (let i = 0; i < (L.td ? 0 : Math.max(0, lives)); i++) { ctx.fillRect(x + 62 + i * 14, y + 36, 9, 10); ctx.fillStyle = '#43d9e8'; ctx.fillRect(x + 66 + i * 14, y + 39, 5, 3); ctx.fillStyle = '#d8dde3'; }
  T(WEAPONS[wpn].name + (wup[wpn] ? ' MK' + (wup[wpn] + 1) : ''), x + 140, y + 8, 11, wup[wpn] ? '#ff7a2f' : '#8a909b', 'left', true, 2);
  for (let i = 0; i < 3; i++) { ctx.fillStyle = i < (wpn === 0 ? wLevel : wup[wpn]) ? (wpn === 0 ? '#43d9e8' : '#ff7a2f') : '#2b2f37'; ctx.fillRect(x + 140 + i * 30, y + 14, 26, 9); }
  T(L.endless ? 'DIST ' + maxDist + ' M' : L.td ? 'DEFENCE' : 'SECTOR ' + (levelIndex + 1), x + 140, y + 46, 11, L.endless ? '#ff7a2f' : '#8a909b', 'left', true, 2);

  ctx.fillStyle = 'rgba(8,9,12,0.6)'; ctx.fillRect(VW - 188, y - 8, 180, 64);
  T(String(score).padStart(6, '0'), VW - 20, y + 26, 28, '#e9e5da', 'right', true, 1);
  T('BEST ' + String(Math.max(best, score)).padStart(6, '0'), VW - 20, y + 46, 11, '#8a909b', 'right', true, 2);

  if (boss && !boss.hidden) {
    const bw = 300, bx = VW / 2 - bw / 2, by = VH - 34;
    const frac = boss.state === 'enter' ? Math.min(1, boss.t / 2.2) : boss.hp / boss.maxhp;
    ctx.fillStyle = 'rgba(8,9,12,0.65)'; ctx.fillRect(bx - 8, by - 24, bw + 16, 42);
    T(boss.name || 'FURNACE WARDEN', VW / 2, by - 8, 13, '#ff7a2f', 'center', false, 3);
    ctx.fillStyle = '#2b2f37'; ctx.fillRect(bx, by, bw, 10);
    ctx.fillStyle = '#ff3b4a'; ctx.fillRect(bx, by, bw * frac, 10);
  }

  if (L.td) drawTDHUD();
  if (net.on) drawTeamHUD();
  drawLoadout();

  if (banner) {
    const a = Math.min(1, banner.t / 0.2, (banner.dur - banner.t) / 0.4);
    ctx.globalAlpha = clamp(a, 0, 1);
    T(banner.text, VW / 2, 176, 46, '#e9e5da', 'center', false, 6);
    if (banner.sub) T(banner.sub, VW / 2, 206, 16, '#ff7a2f', 'center', true, 5);
    ctx.globalAlpha = 1;
  }
}

function drawLoadout() {
  const y = VH - 48;
  for (let k = 0; k < NW; k++) {
    const x = 16 + k * 38, W = WEAPONS[k], have = k === 0 || ammo[k] > 0, sel = k === wpn;
    ctx.fillStyle = 'rgba(8,9,12,0.68)'; ctx.fillRect(x, y, 36, 34);
    ctx.strokeStyle = sel ? '#ff7a2f' : (have ? '#4a525e' : '#252a31'); ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, 34, 32);
    T(String(k + 1), x + 4, y + 10, 9, have ? '#8a909b' : '#3a414b', 'left', true, 0);
    T(W.tag, x + 18, y + 21, 10, have ? W.col : '#3a414b', 'center', true, 0);
    for (let j = 0; j < wup[k]; j++) { ctx.fillStyle = '#ff7a2f'; ctx.fillRect(x + 22 + j * 4, y + 4, 3, 3); }
    T(k === 0 ? 'LV' + wLevel : (have ? String(ammo[k]) : '--'), x + 18, y + 31, 9, have ? '#e9e5da' : '#3a414b', 'center', true, 0);
  }
  const btn = (x, w, key, label, sub, on, col) => {
    ctx.fillStyle = 'rgba(8,9,12,0.68)'; ctx.fillRect(x, y, w, 34);
    ctx.strokeStyle = on ? (col || '#43d9e8') : '#2f353d'; ctx.lineWidth = 2; ctx.strokeRect(x + 1, y + 1, w - 2, 32);
    T(key + '  ' + label, x + w / 2, y + 15, 11, on ? '#e9e5da' : '#6b7480', 'center', false, 1);
    T(sub, x + w / 2, y + 28, 9, '#8a909b', 'center', true, 1);
  };
  const TT = TURRETS[ttype], mx = maxTurrets();
  { const u = wup[wpn]; btn(620, 76, 'U', 'UPGR', u >= 3 ? 'MAX' : 'COST ' + UPG_COST[u], u < 3 && cells >= UPG_COST[u], '#ff7a2f'); }
  btn(700, 74, 'T', TT.name, 'COST ' + TT.cost, true, TT.col);
  btn(776, 84, 'B', 'BUILD', 'CELLS ' + cells, !carry && cells >= TT.cost && turrets.length < mx);
  btn(864, 80, 'E', carry ? 'PLACE' : 'GRAB', 'TURRETS ' + turrets.length + '/' + mx, !!carry || turrets.length > 0);
  if (carry) T('AIM, THEN PRESS E TO PLACE THE TURRET', VW / 2, VH - 66, 12, '#9be15d', 'center', true, 2);
  if (toast.t > 0) {
    const toy = L.td ? 112 : 74;
    ctx.globalAlpha = clamp(toast.t * 2, 0, 1);
    ctx.fillStyle = 'rgba(8,9,12,0.7)'; ctx.fillRect(VW / 2 - 230, toy, 460, 26);
    T(toast.s, VW / 2, toy + 18, 12, '#e9e5da', 'center', true, 1);
    ctx.globalAlpha = 1;
  }
}

function drawTeamHUD() {
  const rs = [...net.remotes.values()].filter(r => r.tx !== undefined).slice(0, 3);
  rs.forEach((r, i) => {
    const x = 284 + i * 160, y = 6, pal = PAL[r.ci % PAL.length];
    ctx.fillStyle = 'rgba(8,9,12,0.6)'; ctx.fillRect(x, y, 152, 50);
    ctx.fillStyle = pal[0]; ctx.fillRect(x + 8, y + 9, 9, 9);
    T(r.nm, x + 23, y + 18, 12, '#e9e5da', 'left', true, 1);
    if (r.dead) T('DOWN', x + 8, y + 40, 11, '#ff3b4a', 'left', true, 2);
    else for (let k = 0; k < 5; k++) { ctx.fillStyle = k < r.hp ? pal[1] : '#2b2f37'; ctx.fillRect(x + 8 + k * 14, y + 31, 11, 6); }
    T(String(r.sc).padStart(6, '0'), x + 144, y + 42, 12, '#8a909b', 'right', true, 1);
  });
}

function overlay(alpha) { ctx.fillStyle = 'rgba(8,9,12,' + alpha + ')'; ctx.fillRect(0, 0, VW, VH); }
const fmtTime = s => Math.floor(s / 60) + ':' + String(Math.floor(s % 60)).padStart(2, '0');

function drawTitle() {
  cam.x = (time * 36) % ((L.w - 30) * TS);
  drawWorld(false);
  overlay(0.55);
  T('SLAG RUNNER', VW / 2 + 5, 225, 96, '#6b210e', 'center', false, 8);
  T('SLAG RUNNER', VW / 2, 220, 96, '#ff7a2f', 'center', false, 8);
  if (net.on) {
    T('ROOM ' + net.code.toUpperCase(), VW / 2, 268, 16, '#43d9e8', 'center', true, 5);
    const ro = netRoster().slice(0, 6);
    ro.forEach((q, i) => {
      const y = 302 + i * 24;
      ctx.fillStyle = PAL[q.ci % PAL.length][0]; ctx.fillRect(VW / 2 - 120, y - 11, 11, 11);
      T(q.nm + (q.host ? '   HOST' : '') + (q.me ? '   YOU' : ''), VW / 2 - 98, y, 14, '#e9e5da', 'left', true, 2);
    });
    T(net.isHost ? 'PICK A MODE BELOW THE SCREEN' : 'WAITING FOR THE HOST TO START', VW / 2, 302 + Math.max(1, ro.length) * 24 + 18, 13, '#ff7a2f', 'center', true, 3);
    return;
  }
  T('CHOOSE A MODE', VW / 2, 272, 14, '#e9e5da', 'center', true, 4);
  for (const b of TITLE_BTNS) {
    const off = b.start === 'online' && !net.avail;
    const hot = !off && aim.mode === 'mouse' && aim.x >= b.x && aim.x <= b.x + b.w && aim.y >= b.y && aim.y <= b.y + b.h;
    ctx.fillStyle = hot ? '#ff7a2f' : 'rgba(20,23,28,0.9)'; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hot ? '#ffd27a' : (off ? '#4a525e' : '#43d9e8'); ctx.lineWidth = 2; ctx.strokeRect(b.x + 1, b.y + 1, b.w - 2, b.h - 2);
    T(b.label, b.x + b.w / 2, b.y + 28, 19, hot ? '#150a04' : (off ? '#6b7480' : '#e9e5da'), 'center', false, 4);
    T(off ? 'NOT AVAILABLE HERE' : b.sub, b.x + b.w / 2, b.y + 46, 10, hot ? '#3a1a08' : '#8a909b', 'center', true, 2);
  }
  T('MOVE W A D    SHOOT CLICK', VW / 2, 396, 13, '#8a909b', 'center', true, 3);
  T('STOMP THE CRAWLERS. FIND NEW WEAPONS. SPEND CELLS ON TURRETS.', VW / 2, 418, 13, '#8a909b', 'center', true, 2);
  T('1-8 WEAPONS    T TURRET TYPE    B BUILD    E GRAB / PLACE', VW / 2, 440, 13, '#8a909b', 'center', true, 3);
  if (best > 0) T('BEST ' + String(best).padStart(6, '0'), VW / 2, 470, 13, '#e9e5da', 'center', true, 3);
}

function render() {
  ctx.setTransform(scale, 0, 0, scale, 0, 0);
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, VW, VH);
  if (!L) return;
  if (state === 'title') { drawTitle(); return; }
  drawWorld(true);
  const vg = ctx.createRadialGradient(VW / 2, VH / 2, VH * 0.45, VW / 2, VH / 2, VH * 0.95);
  vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.38)');
  ctx.fillStyle = vg; ctx.fillRect(0, 0, VW, VH);
  drawHUD();
  if (P.dead && state === 'play') {
    ctx.fillStyle = 'rgba(120,10,10,' + (0.22 * Math.min(1, P.deadT * 2)) + ')'; ctx.fillRect(0, 0, VW, VH);
  }
  if (state === 'paused') {
    overlay(0.6);
    T('PAUSED', VW / 2, 270, 56, '#e9e5da', 'center', false, 8);
    T('CLICK TO RESUME', VW / 2, 310, 15, '#43d9e8', 'center', true, 4);
  } else if (state === 'clear') {
    overlay(0.62);
    T('SECTOR CLEARED', VW / 2, 190, 52, '#e9e5da', 'center', false, 6);
    T(L.name.toUpperCase(), VW / 2, 220, 15, '#ff7a2f', 'center', true, 5);
    T('CELLS   ' + L.scrapGot + ' / ' + L.scrapTotal, VW / 2, 272, 18, '#e9e5da', 'center', true, 2);
    T('TIME    ' + fmtTime(L.time), VW / 2, 300, 18, '#e9e5da', 'center', true, 2);
    T('HULL BONUS   +' + L.bonus, VW / 2, 328, 18, '#ffd27a', 'center', true, 2);
    if (L.lifeGain) T('EXTRA RETRY   +1', VW / 2, 356, 18, '#9be15d', 'center', true, 2);
    if (clearT > 0.8 && Math.sin(time * 4) > -0.3) T(net.on && !net.isHost ? 'WAITING FOR THE HOST' : levelIndex === LEVELS.length - 1 ? 'CLICK TO CONTINUE' : 'CLICK FOR NEXT SECTOR', VW / 2, 408, 16, '#43d9e8', 'center', true, 4);
  } else if (state === 'over') {
    overlay(0.7);
    T(L.td ? 'REACTOR LOST' : 'SYSTEM FAILURE', VW / 2, 220, 56, '#ff3b4a', 'center', false, 6);
    T('SCORE ' + String(score).padStart(6, '0'), VW / 2, 264, 18, '#e9e5da', 'center', true, 3);
    T(L.td ? 'REACHED WAVE ' + tdInfo().w : L.endless ? 'DISTANCE ' + maxDist + ' M' : 'REACHED SECTOR ' + (levelIndex + 1), VW / 2, 292, 13, '#8a909b', 'center', true, 3);
    if (clearT > 0.9 && Math.sin(time * 4) > -0.3) T(net.on && !net.isHost ? 'WAITING FOR THE HOST' : L.td ? 'CLICK TO DEFEND AGAIN' : 'CLICK TO RETRY THIS SECTOR', VW / 2, 346, 16, '#43d9e8', 'center', true, 4);
    T('MENU BUTTON FOR MODE SELECT', VW / 2, 376, 11, '#8a909b', 'center', true, 3);
  } else if (state === 'win') {
    overlay(0.72);
    T('FOUNDRY OFFLINE', VW / 2, 200, 56, '#ff7a2f', 'center', false, 6);
    T('THE OMEGA CORE IS SLAG. THE FURNACES GO DARK.', VW / 2, 234, 14, '#e9e5da', 'center', true, 3);
    T('FINAL SCORE ' + String(score).padStart(6, '0'), VW / 2, 290, 22, '#ffd27a', 'center', true, 3);
    T('BEST ' + String(best).padStart(6, '0'), VW / 2, 318, 13, '#8a909b', 'center', true, 3);
    T('MORE SECTORS DETECTED. THE FOUNDRY GOES DEEPER.', VW / 2, 360, 13, '#e9e5da', 'center', true, 3);
    if (clearT > 0.8 && Math.sin(time * 4) > -0.3) T(net.on && !net.isHost ? 'WAITING FOR THE HOST' : 'CLICK TO ENTER ENDLESS MODE', VW / 2, 406, 16, '#43d9e8', 'center', true, 4);
  }
}

/* ================= main loop ================= */
let scale = 1;
function resize() {
  const r = cv.getBoundingClientRect();
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const w = Math.max(320, Math.round((r.width || VW) * dpr));
  if (cv.width !== w) { cv.width = w; cv.height = Math.round(w * VH / VW); }
  scale = cv.width / VW;
}
if (window.ResizeObserver) new ResizeObserver(resize).observe(cv);
window.addEventListener('resize', resize);
resize();

let last = 0, acc = 0;
function frame(ts) {
  requestAnimationFrame(frame);
  if (!last) last = ts;
  let d = (ts - last) / 1000;
  last = ts;
  if (d > 0.25) d = 0.25;
  acc += d;
  if (net.on) netFrame(d, ts);
  let n = 0;
  while (acc >= DT) { step(DT); acc -= DT; n++; }
  if (n) clearJust();
  if (net.on) netPresence(ts);
  render();
}

loadLevel(0);
banner = null;
requestAnimationFrame(frame);
})();
</script>

</body></html>
